<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#13120d" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta
      name="description"
      content="Groovist: chords and lyrics for your songs and your band."
    />
    <title>Groovist</title>
    <script>
      document.addEventListener("gesturestart", (event) => event.preventDefault());
      var themeColors = { stage: "#13120d", day: "#fff", "cb-rg": "#101418", "cb-by": "#15110f", contrast: "#000" };
      var theme = (function () { try { return localStorage.getItem("leadSheetsTheme"); } catch (error) { return null; } })();
      if (!Object.prototype.hasOwnProperty.call(themeColors, theme)) theme = "stage";
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').setAttribute("content", themeColors[theme]);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
