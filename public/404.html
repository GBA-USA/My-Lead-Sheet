<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lead Sheets</title>
    <script>
      (async () => {
        const folders = location.pathname.split("/").filter(Boolean);
        for (let depth = folders.length - 1; depth >= 0; depth--) {
          const root = "/" + folders.slice(0, depth).map((name) => name + "/").join("");
          const found = await fetch(root, { method: "HEAD" }).catch(() => null);
          if (found?.ok) return location.replace(root + location.search + location.hash);
        }
      })();
    </script>
  </head>
  <body>
    <p><a href="/">Lead Sheets</a></p>
  </body>
</html>
